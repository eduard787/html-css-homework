<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма зворотного зв'язку</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <nav>
        <ul>
          <li><a href="../index.html">Головна сторінка</a></li>
          <li><a href="#feedback-form">Перейти до форми ⬇</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="feedback-form" class="content-section">
        <h1>Зворотний зв'язок</h1>

        <form action="#" method="GET">
          <label for="user-name">Ваше ім'я:</label>
          <input type="text" id="user-name" name="user-name" required />

          <label for="user-email">Електронна пошта:</label>
          <input type="email" id="user-email" name="user-email" required />

          <label for="user-age">Ваш вік:</label>
          <input
            type="number"
            id="user-age"
            name="user-age"
            min="1"
            max="120"
          />

          <label for="user-city">Оберіть місто:</label>
          <select id="user-city" name="user-city">
            <option value="kyiv">Київ</option>
            <option value="lviv">Львів</option>
            <option value="odesa">Одеса</option>
          </select>

          <fieldset>
            <legend>Як ви дізналися про нас?</legend>
            <input
              type="radio"
              id="source-internet"
              name="source-info"
              value="internet"
              checked
            />
            <label for="source-internet">З Інтернету</label>

            <input
              type="radio"
              id="source-friend"
              name="source-info"
              value="friend"
            />
            <label for="source-friend">Від друзів</label>
          </fieldset>

          <fieldset>
            <legend>Ваші інтереси:</legend>
            <input
              type="checkbox"
              id="interest-web"
              name="user-interest"
              value="web"
            />
            <label for="interest-web">Веб-розробка</label>

            <input
              type="checkbox"
              id="interest-design"
              name="user-interest"
              value="design"
            />
            <label for="interest-design">Дизайн</label>
          </fieldset>

          <label for="user-message">Ваше повідомлення:</label>
          <textarea
            id="user-message"
            name="user-message"
            rows="4"
            cols="40"
            required
          ></textarea>

          <input
            type="checkbox"
            id="user-terms"
            name="user-terms"
            value="agreed"
            required
          />
          <label for="user-terms">Я погоджуюсь на обробку моїх даних</label>

          <button type="submit">Відправити форму</button>
          <button type="reset">Очистити</button>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p>© 2026 Едуард Гутовський</p>
    </footer>
  </body>
</html>
